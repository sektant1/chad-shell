$mainMod = SUPER

bind = SUPER, T, exec, $terminal
bind = SUPER, B, exec, sh -c 'command -v xdg-open >/dev/null 2>&1 && xdg-open about:blank || firefox'
bind = SUPER SHIFT, F, exec, $fileManager
bind = SUPER, F, fullscreen, 
bind = SUPER, W, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER SHIFT, T, layoutmsg, togglesplit
bind = SUPER, SPACE, exec, $menu
bind = SUPER SHIFT, B, exec, ~/.config/hypr/scripts/toggle-waybar.sh
bind = SUPER, E, exec, ~/.config/hypr/scripts/toggle-eww-dashboard.sh
bind = SUPER, A, exec, ~/.config/hypr/scripts/toggle-eww-visualizer.sh

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

bind = SUPER, P, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; command -v grim >/dev/null 2>&1 && command -v slurp >/dev/null 2>&1 && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d-%H%M%S).png"'
bind = , XF86Display, exec, hyprctl dispatch cyclenextmonitor
bind = , XF86Launch1, exec, sh -c 'command -v hyprlock >/dev/null 2>&1 && hyprlock'

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-'
bindel = , XF86AudioMute, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'
bindel = , XF86AudioMicMute, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
bindel = , XF86MonBrightnessUp, exec, sh -c 'command -v brightnessctl >/dev/null 2>&1 && brightnessctl set 10%+'
bindel = , XF86MonBrightnessDown, exec, sh -c 'command -v brightnessctl >/dev/null 2>&1 && brightnessctl set 10%-'

bindl = , XF86AudioNext, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl next'
bindl = , XF86AudioPause, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl play-pause'
bindl = , XF86AudioPlay, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl play-pause'
bindl = , XF86AudioPrev, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl previous'
