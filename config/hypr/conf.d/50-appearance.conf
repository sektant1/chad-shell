general {
    col.active_border = rgba(4fc9f5ff)
    # col.inactive_border = rgba(00000000)
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    active_opacity = 0.97
    inactive_opacity = 0.94

    shadow {
        enabled = false
        range = 0
        render_power = 0
        color = rgba(00000000)
    }

    blur {
        enabled = true
        size = 2
        passes = 1
        brightness = 0.4
    }
}
