$terminal = sh -c 'for t in alacritty kitty foot wezterm ghostty xterm; do command -v "$t" >/dev/null 2>&1 && exec "$t"; done'
$fileManager = sh -c 'for f in thunar pcmanfm nautilus dolphin xdg-open; do command -v "$f" >/dev/null 2>&1 && exec "$f" "$HOME"; done'
$menu = rofi -show drun

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_DPI_SCALE,1
env = XFT_DPI,96
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_SCALE_FACTOR,1
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
