# Dionysus Hyprland config
# Portable defaults for laptops, desktops, VMs and mixed-DPI setups.

# Monitors: let Hyprland choose native mode/position/scale. Override in
# ~/.config/hypr/local.conf when a host needs a fixed layout.
monitor = 1920x1080@120, preferred, auto, 1

$terminal = sh -c 'for t in alacritty kitty foot wezterm ghostty xterm; do command -v "$t" >/dev/null 2>&1 && exec "$t"; done'
$fileManager = sh -c 'for f in thunar pcmanfm nautilus dolphin xdg-open; do command -v "$f" >/dev/null 2>&1 && exec "$f" "$HOME"; done'
$menu = rofi -show drun

exec-once = ~/.config/hypr/scripts/waybar_watcher.sh
exec = ~/.config/hypr/scripts/workspace-layout.sh
exec-once = sh -c 'command -v cava >/dev/null 2>&1 && cava -p "${XDG_CONFIG_HOME:-$HOME/.config}/cava/config"'
exec-once = sh -c 'test -x "${XDG_CONFIG_HOME:-$HOME/.config}/eww/scripts/audio/audio_visualizer.py" && "${XDG_CONFIG_HOME:-$HOME/.config}/eww/scripts/audio/audio_visualizer.py"'
exec-once = sh -c 'test -f "${XDG_CONFIG_HOME:-$HOME/.config}/rofi/image.png" && cp "${XDG_CONFIG_HOME:-$HOME/.config}/rofi/image.png" /dev/shm/rofi_image.png || true'

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_DPI_SCALE,1
env = XFT_DPI,96
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_SCALE_FACTOR,1

general {
    col.active_border = rgba(4fc9f5ff)
    # col.inactive_border = rgba(00000000)
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    active_opacity = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = false
        range = 0
        render_power = 0
        color = rgba(00000000)
    }

    blur {
        enabled = true
        size = 2
        passes = 1
        brightness = 0.4
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, linear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 0
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    kb_options = ctrl:nocaps
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

$mainMod = SUPER

bind = SUPER, T, exec, $terminal
bind = SUPER, B, exec, sh -c 'command -v xdg-open >/dev/null 2>&1 && xdg-open about:blank || firefox'
bind = SUPER, F, exec, $fileManager
bind = SUPER, W, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER SHIFT, T, layoutmsg, togglesplit
bind = SUPER, SPACE, exec, $menu
bind = SUPER SHIFT, B, exec, ~/.config/hypr/scripts/toggle-waybar.sh

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

bind = SUPER, P, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; command -v grim >/dev/null 2>&1 && command -v slurp >/dev/null 2>&1 && grim -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d-%H%M%S).png"'
bind = , XF86Display, exec, hyprctl dispatch cyclenextmonitor
bind = , XF86Launch1, exec, sh -c 'command -v hyprlock >/dev/null 2>&1 && hyprlock'

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-'
bindel = , XF86AudioMute, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'
bindel = , XF86AudioMicMute, exec, sh -c 'command -v wpctl >/dev/null 2>&1 && wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
bindel = , XF86MonBrightnessUp, exec, sh -c 'command -v brightnessctl >/dev/null 2>&1 && brightnessctl set 10%+'
bindel = , XF86MonBrightnessDown, exec, sh -c 'command -v brightnessctl >/dev/null 2>&1 && brightnessctl set 10%-'

bindl = , XF86AudioNext, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl next'
bindl = , XF86AudioPause, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl play-pause'
bindl = , XF86AudioPlay, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl play-pause'
bindl = , XF86AudioPrev, exec, sh -c 'command -v playerctl >/dev/null 2>&1 && playerctl previous'


windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
windowrule = no_focus on, match:class ^(eww)$

workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true

splash = false



source = ~/.config/hypr/local.conf



