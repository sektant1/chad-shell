exec-once = ~/.config/hypr/scripts/waybar_watcher.sh
# Emacs daemon: Initiate Emacs daemon
exec-once = /usr/bin/emacs --daemon
exec = ~/.config/hypr/scripts/workspace-layout.sh
exec-once = sh -c 'test "${DIONYSUS_ENABLE_AUDIO_VISUALIZER:-0}" = 1 && command -v cava >/dev/null 2>&1 && cava -p "${XDG_CONFIG_HOME:-$HOME/.config}/cava/config"'
exec-once = sh -c 'test "${DIONYSUS_ENABLE_AUDIO_VISUALIZER:-0}" = 1 && test -x "${XDG_CONFIG_HOME:-$HOME/.config}/eww/scripts/audio/audio_visualizer.py" && "${XDG_CONFIG_HOME:-$HOME/.config}/eww/scripts/audio/audio_visualizer.py" --fps "${DIONYSUS_VISUALIZER_FPS:-15}"'
exec-once = sh -c 'test -f "${XDG_CONFIG_HOME:-$HOME/.config}/rofi/image.png" && cp "${XDG_CONFIG_HOME:-$HOME/.config}/rofi/image.png" /dev/shm/rofi_image.png || true'
